<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - تطبيق الحضور للبصمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 text-center">
        <h1 class="text-2xl font-bold text-blue-400 mb-2">تسجيل الحضور والانصراف</h1>
        <p class="text-xs text-slate-400 mb-6">بصمة الوجه والموقع الجغرافي المعتمد</p>

        <div id="loginStep" class="space-y-4">
            <input type="text" id="phoneInput" placeholder="رقم الهاتف المسجل" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-center">
            <input type="text" id="hrIdInput" placeholder="كود الـ HR ID الخاص بك" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-center uppercase">
            <button onclick="verifyEmployee()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-lg">التحقق وتسجيل البصمة</button>
        </div>

        <div id="attendanceStep" class="hidden space-y-4">
            <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 text-right">
                <p class="text-sm">مرحباً، <span id="empDisplayName" class="font-bold text-emerald-400"></span></p>
                <p class="text-xs text-slate-400 mt-1">الحالة: جاهز لتسجيل البصمة داخل النطاق المحدد.</p>
            </div>
            <button onclick="submitAttendance()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-3 rounded-lg shadow-lg">📸 تسجيل الحضور الآن</button>
        </div>
    </div>

    <script type="module">
        import { database, ref, get, push } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company');
        let currentEmpData = null;

        window.verifyEmployee = function() {
            const phone = document.getElementById('phoneInput').value.trim();
            const hrId = document.getElementById('hrIdInput').value.trim().toUpperCase();

            if(!phone || !hrId) { alert('أدخل رقم الهاتف والـ HR ID'); return; }

            get(ref(database, `companiesData/${currentCompany}/employees/${hrId}`)).then((snapshot) => {
                if(snapshot.exists()) {
                    const emp = snapshot.val();
                    if(emp.phone === phone && emp.status === 'active') {
                        currentEmpData = emp;
                        document.getElementById('empDisplayName').innerText = emp.name;
                        document.getElementById('loginStep').classList.add('hidden');
                        document.getElementById('attendanceStep').classList.remove('hidden');
                    } else {
                        alert('البيانات غير مطابقة أو أن الحساب محظور.');
                    }
                } else {
                    alert('لم يتم العثور على الموظف بهذا الكود!');
                }
            });
        }

        window.submitAttendance = function() {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع الجغرافي");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                // جلب إطارات مكان العمل من الفايرباس للتحقق من الزون
                get(ref(database, `companiesData/${currentCompany}/settings/location`)).then((snapshot) => {
                    if(snapshot.exists()) {
                        const target = snapshot.val();
                        // حساب التقريب الجغرافي البسيط (أو السماح لو في النطاق القريب)
                        const distance = Math.abs(target.lat - userLat) + Math.abs(target.lng - userLng);
                        
                        // النطاق المسموح (تقريبي مسافة آمنة)
                        if(distance < 0.05) { 
                            push(ref(database, `companiesData/${currentCompany}/attendance`), {
                                empId: currentEmpData.empId,
                                name: currentEmpData.name,
                                time: new Date().toLocaleString(),
                                type: 'حضور'
                            }).then(() => {
                                alert('تم تسجيل الحضور بنجاح وصورة الوجه مقبولة داخل النطاق!');
                                location.reload();
                            });
                        } else {
                            alert('عذراً، أنت خارج النطاق الجغرافي (الزون) المخصص للعمل!');
                        }
                    } else {
                        alert('لم يتم تحديد نطاق العمل من قبل الإدارة بعد.');
                    }
                });
            }, () => {
                alert('فشل تحديد موقعك الجغرافي. تأكد من تفعيل الـ GPS.');
            });
        }
    </script>
</body>
</html>

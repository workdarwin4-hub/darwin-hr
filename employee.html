<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - تطبيق الموظف</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="loginScreen" class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800 text-center">
        <h1 class="text-2xl font-bold text-blue-400 mb-2">تسجيل دخول الموظف</h1>
        <p class="text-xs text-slate-400 mb-6">أدخل رقم هاتفك وكود الـ HR ID</p>
        <div class="space-y-4">
            <input type="text" id="loginPhone" placeholder="رقم الهاتف" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-center text-sm focus:outline-none">
            <input type="text" id="loginHrId" placeholder="كود الـ HR ID" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-center text-sm focus:outline-none">
            <button onclick="empLogin()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl shadow-lg transition">دخول للنظام</button>
        </div>
    </div>

    <div id="dashboardScreen" class="hidden w-full max-w-md bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col justify-between min-h-[680px] p-5">
        <div>
            <div class="flex items-center justify-between mb-4 bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                <div class="text-right">
                    <h2 id="profileName" class="font-bold text-base text-white"></h2>
                    <p class="text-xs text-blue-400 mt-0.5">فرع: <span id="profileBranch"></span></p>
                </div>
                <img id="profileImg" src="https://via.placeholder.com/60" class="w-12 h-12 rounded-full object-cover border-2 border-blue-500">
            </div>

            <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 text-center space-y-3">
                <div id="punchStatusText" class="text-xs font-bold text-blue-300">جارٍ التحقق من البصمة واليوم...</div>

                <div id="cameraContainer" class="relative rounded-2xl overflow-hidden border border-slate-700 bg-black hidden">
                    <video id="videoElement" autoplay playsinline class="w-full h-40 object-cover"></video>
                    <canvas id="canvasElement" class="hidden"></canvas>
                </div>

                <button id="punchActionBtn" onclick="startPunchProcess()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl shadow-lg text-xs transition">
                    📸 بصمة دخول (بالوجه فقط)
                </button>
            </div>
        </div>

        <div class="mt-4 text-center">
            <button onclick="empLogout()" class="text-xs text-red-400 hover:text-red-300">تسجيل الخروج</button>
        </div>
    </div>

    <script type="module">
        import { database, ref, get, push, onValue } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company');
        if(!currentCompany) window.location.href = 'index.html';

        let currentEmp = null;
        let empBranch = null;
        let videoStream = null;
        let currentPunchState = 'دخول';
        let isDayOffBlocked = false;

        window.onload = function() {
            const savedHrId = localStorage.getItem('darwin_emp_hrid');
            const savedPhone = localStorage.getItem('darwin_emp_phone');
            if(savedHrId && savedPhone) verifyAndLoadUser(savedHrId, savedPhone);
        }

        window.empLogin = function() {
            const phone = document.getElementById('loginPhone').value.trim();
            const hrId = document.getElementById('loginHrId').value.trim();
            if(!phone || !hrId) { alert('أدخل الهاتف والـ HR ID'); return; }
            verifyAndLoadUser(hrId, phone, true);
        }

        function verifyAndLoadUser(hrId, phone, saveToStorage = false) {
            get(ref(database, `companiesData/${currentCompany}/employees/${hrId}`)).then((snapshot) => {
                if(snapshot.exists()) {
                    const emp = snapshot.val();
                    if(emp.phone === phone && emp.status === 'active') {
                        currentEmp = emp;
                        if(saveToStorage) {
                            localStorage.setItem('darwin_emp_hrid', hrId);
                            localStorage.setItem('darwin_emp_phone', phone);
                        }

                        const todayDayName = new Date().toLocaleDateString('ar-EG', { weekday: 'long' });
                        if(emp.dayOff === todayDayName && !emp.unlockDayOff) {
                            isDayOffBlocked = true;
                        }

                        get(ref(database, `companiesData/${currentCompany}/branches/${emp.branchId}`)).then((bSnap) => {
                            if(bSnap.exists()) empBranch = bSnap.val();
                            document.getElementById('profileBranch').innerText = empBranch ? empBranch.name : 'فرع عام';
                            document.getElementById('profileName').innerText = emp.name;
                            document.getElementById('profileImg').src = emp.profileImg || 'https://via.placeholder.com/60';
                            
                            document.getElementById('loginScreen').classList.add('hidden');
                            document.getElementById('dashboardScreen').classList.remove('hidden');
                            
                            if(isDayOffBlocked) {
                                document.getElementById('punchStatusText').innerText = `⚠️ اليوم هو إجازتك الأسبوعية (${emp.dayOff}). البصمة مغلقة إلا بإذن الأدمن.`;
                                document.getElementById('punchActionBtn').disabled = true;
                                document.getElementById('punchActionBtn').className = "w-full bg-slate-700 font-bold py-3 rounded-xl text-xs text-slate-400 cursor-not-allowed";
                            } else {
                                checkTodayAttendanceStatus(emp.empId);
                            }
                        });
                    } else {
                        alert('بيانات غير صحيحة أو الحساب موقوف.');
                        empLogout();
                    }
                } else {
                    if(saveToStorage) alert('الموظف غير موجود!');
                    empLogout();
                }
            });
        }

        function checkTodayAttendanceStatus(empId) {
            const todayStr = new Date().toLocaleDateString();
            onValue(ref(database, `companiesData/${currentCompany}/attendance`), (snapshot) => {
                let hasIn = false;
                let hasOut = false;

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        let log = child.val();
                        if(log.empId === empId && log.time.includes(todayStr)) {
                            if(log.type === 'دخول') hasIn = true;
                            if(log.type === 'خروج') hasOut = true;
                        }
                    });
                }

                const btn = document.getElementById('punchActionBtn');
                const statusText = document.getElementById('punchStatusText');

                if(!hasIn) {
                    currentPunchState = 'دخول';
                    statusText.innerText = "الرجاء تسجيل بصمة (الدخول)";
                    btn.innerText = "📸 بصمة دخول (بالوجه فقط)";
                } else if(hasIn && !hasOut) {
                    currentPunchState = 'خروج';
                    statusText.innerText = "تم تسجيل الدخول. يمكنك تسجيل (الخروج) نهاية الشفت";
                    btn.innerText = "📸 بصمة خروج (بالوجه فقط)";
                    btn.className = "w-full bg-amber-600 hover:bg-amber-700 font-bold py-3 rounded-xl shadow-lg text-xs transition";
                } else {
                    currentPunchState = 'مكتمل';
                    statusText.innerText = "✅ لقد أكملت بصمتي اليوم بنجاح.";
                    btn.innerText = "تم تسجيل بصمات اليوم";
                    btn.disabled = true;
                    btn.className = "w-full bg-slate-700 font-bold py-3 rounded-xl text-xs text-slate-400 cursor-not-allowed";
                }
            });
        }

        window.empLogout = function() {
            localStorage.removeItem('darwin_emp_hrid');
            localStorage.removeItem('darwin_emp_phone');
            location.reload();
        }

        window.startPunchProcess = function() {
            if(currentPunchState === 'مكتمل' || isDayOffBlocked) return;
            document.getElementById('cameraContainer').classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                videoStream = stream;
                document.getElementById('videoElement').srcObject = stream;
                document.getElementById('punchActionBtn').innerText = `📸 التقاط الوجه وتسجيل (${currentPunchState})`;
                document.getElementById('punchActionBtn').setAttribute('onclick', 'executePunch()');
            }).catch(() => { alert('فشل تشغيل كاميرا الهاتف.'); });
        }

        window.executePunch = function() {
            if (!empBranch) { alert("ليس لديك فرع محدد!"); return; }
            if (!navigator.geolocation) { alert("المتصفح لا يدعم الـ GPS"); return; }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                const distance = Math.abs(empBranch.lat - userLat) + Math.abs(empBranch.lng - userLng);

                if(distance < 0.05) {
                    const video = document.getElementById('videoElement');
                    const canvas = document.getElementById('canvasElement');
                    if(video.videoWidth === 0) { alert("انتظر حتى تفتح الكاميرا."); return; }

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const faceImage = canvas.toDataURL('image/png');

                    push(ref(database, `companiesData/${currentCompany}/attendance`), {
                        empId: currentEmp.empId,
                        name: currentEmp.name,
                        branch: empBranch.name,
                        type: currentPunchState,
                        time: new Date().toLocaleString(),
                        faceImage: faceImage
                    }).then(() => {
                        alert(`تم تسجيل (${currentPunchState}) بنجاح وبصمة الوجه معتمدة!`);
                        if(videoStream) videoStream.getTracks().forEach(t => t.stop());
                        location.reload();
                    });

                } else {
                    alert(`أنت خارج نطاق فرعك (${empBranch.name})!`);
                }
            }, () => { alert('يرجى تفعيل موقعك الجغرافي (GPS).'); });
        }
    </script>
</body>
</html>

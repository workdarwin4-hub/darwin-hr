<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - تطبيق الموظفين والبصمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700 text-center">
        <h1 class="text-2xl font-bold text-blue-400 mb-2">تطبيق الموظف الذكي</h1>
        <p class="text-xs text-slate-400 mb-6">بصمة الوجه والموقع الجغرافي الخاص بفرعك</p>

        <div id="loginStep" class="space-y-4">
            <input type="text" id="phoneInput" placeholder="رقم الهاتف المسجل" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-center">
            <input type="text" id="hrIdInput" placeholder="كود الـ HR ID الخاص بك" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-center">
            <button onclick="verifyEmployee()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-lg">دخول للنظام</button>
        </div>

        <div id="attendanceStep" class="hidden space-y-4 text-right">
            <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-between">
                <div>
                    <p class="text-sm">مرحباً، <span id="empDisplayName" class="font-bold text-emerald-400"></span></p>
                    <p class="text-xs text-slate-400 mt-1">الفرع المخصص: <span id="branchDisplayName" class="text-amber-400 font-bold"></span></p>
                </div>
                <img id="empProfilePic" src="" class="w-12 h-12 rounded-full object-cover border border-blue-500">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-300">اختر نوع البصمة:</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setPunchType('دخول')" id="btnIn" class="p-3 rounded-lg font-bold border border-slate-700 bg-blue-600 text-white transition">تسجيل دخول</button>
                    <button onclick="setPunchType('خروج')" id="btnOut" class="p-3 rounded-lg font-bold border border-slate-700 bg-slate-900 text-slate-400 transition">تسجيل خروج</button>
                </div>
            </div>
            
            <div class="relative rounded-xl overflow-hidden border border-slate-700 bg-black">
                <video id="videoElement" autoplay playsinline class="w-full h-48 object-cover"></video>
                <canvas id="canvasElement" class="hidden"></canvas>
            </div>

            <button onclick="captureAndSubmit()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-3 rounded-lg shadow-lg">📸 التقاط وبصم الوجه الآن</button>
            
            <div class="mt-4 pt-4 border-t border-slate-700">
                <h3 class="text-sm font-bold text-blue-300 mb-2">📅 سجل حضورك</h3>
                <div id="weeklyLogs" class="text-xs space-y-1 text-slate-300"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, get, push, onValue } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company');
        let currentEmpData = null;
        let empBranchData = null;
        let videoStream = null;
        let selectedType = 'دخول';

        window.setPunchType = function(type) {
            selectedType = type;
            if(type === 'دخول') {
                document.getElementById('btnIn').className = "p-3 rounded-lg font-bold border border-slate-700 bg-blue-600 text-white transition";
                document.getElementById('btnOut').className = "p-3 rounded-lg font-bold border border-slate-700 bg-slate-900 text-slate-400 transition";
            } else {
                document.getElementById('btnOut').className = "p-3 rounded-lg font-bold border border-slate-700 bg-blue-600 text-white transition";
                document.getElementById('btnIn').className = "p-3 rounded-lg font-bold border border-slate-700 bg-slate-900 text-slate-400 transition";
            }
        }

        window.verifyEmployee = function() {
            const phone = document.getElementById('phoneInput').value.trim();
            const hrId = document.getElementById('hrIdInput').value.trim();

            if(!phone || !hrId) { alert('أدخل الهاتف والـ HR ID'); return; }

            get(ref(database, `companiesData/${currentCompany}/employees/${hrId}`)).then((snapshot) => {
                if(snapshot.exists()) {
                    const emp = snapshot.val();
                    if(emp.phone === phone && emp.status === 'active') {
                        currentEmpData = emp;
                        
                        // جلب بيانات فرع الموظف المخصوص
                        get(ref(database, `companiesData/${currentCompany}/branches/${emp.branchId}`)).then((branchSnap) => {
                            if(branchSnap.exists()) {
                                empBranchData = branchSnap.val();
                                document.getElementById('branchDisplayName').innerText = empBranchData.name;
                            } else {
                                document.getElementById('branchDisplayName').innerText = 'فرع غير مخصص';
                            }

                            document.getElementById('empDisplayName').innerText = emp.name;
                            document.getElementById('empProfilePic').src = emp.profileImg || 'https://via.placeholder.com/50';
                            document.getElementById('loginStep').classList.add('hidden');
                            document.getElementById('attendanceStep').classList.remove('hidden');
                            startCamera();
                            loadWeeklyLogs(emp.empId);
                        });

                    } else {
                        alert('بيانات غير صحيحة أو أن الحساب موقوف.');
                    }
                } else {
                    alert('لم يتم العثور على الموظف!');
                }
            });
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
                videoStream = stream;
                document.getElementById('videoElement').srcObject = stream;
            }).catch(() => {
                alert('فشل تشغيل الكاميرا لبصمة الوجه.');
            });
        }

        window.captureAndSubmit = function() {
            if (!empBranchData) { alert("هذا الموظف ليس لديه فرع مخصص!"); return; }
            if (!navigator.geolocation) { alert("المتصفح لا يدعم الـ GPS"); return; }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                // مقارنة موقع الموظف بإحداثيات فرعه الخاص فقط
                const distance = Math.abs(empBranchData.lat - userLat) + Math.abs(empBranchData.lng - userLng);
                
                if(distance < 0.05) {
                    const video = document.getElementById('videoElement');
                    const canvas = document.getElementById('canvasElement');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const faceImage = canvas.toDataURL('image/png');

                    const todayStr = new Date().toLocaleDateString();
                    get(ref(database, `companiesData/${currentCompany}/attendance`)).then((attSnap) => {
                        let alreadyPunched = false;
                        if(attSnap.exists()) {
                            attSnap.forEach(ch => {
                                let log = ch.val();
                                if(log.empId === currentEmpData.empId && log.time.includes(todayStr) && log.type === selectedType) {
                                    alreadyPunched = true;
                                }
                            });
                        }

                        if(alreadyPunched) {
                            alert(`لقد قمت بتسجيل (${selectedType}) مسبقاً اليوم ولا يمكنك التكرار!`);
                            return;
                        }

                        push(ref(database, `companiesData/${currentCompany}/attendance`), {
                            empId: currentEmpData.empId,
                            name: currentEmpData.name,
                            branch: empBranchData.name,
                            type: selectedType,
                            time: new Date().toLocaleString(),
                            faceImage: faceImage
                        }).then(() => {
                            alert(`تم تسجيل ${selectedType} وبصمة الوجه بنجاح داخل فرع (${empBranchData.name})!`);
                            if(videoStream) videoStream.getTracks().forEach(t => t.stop());
                            location.reload();
                        });
                    });

                } else {
                    alert(`عذراً، أنت خارج النطاق الجغرافي لفرعك (${empBranchData.name})!`);
                }
            }, () => { alert('يرجى السماح بتحديد الموقع الجغرافي.'); });
        }

        function loadWeeklyLogs(empId) {
            onValue(ref(database, `companiesData/${currentCompany}/attendance`), (snapshot) => {
                const container = document.getElementById('weeklyLogs');
                container.innerHTML = '';
                if(snapshot.exists()) {
                    let count = 0;
                    snapshot.forEach(child => {
                        let log = child.val();
                        if(log.empId === empId) {
                            count++;
                            container.innerHTML += `<div class="p-2 bg-slate-900 rounded flex justify-between"><span>${log.time} (${log.branch})</span><span class="text-emerald-400 font-bold">${log.type}</span></div>`;
                        }
                    });
                    if(count === 0) container.innerHTML = '<p class="text-slate-500">لا توجد سجلات بعد.</p>';
                } else {
                    container.innerHTML = '<p class="text-slate-500">لا توجد سجلات بعد.</p>';
                }
            });
        }
    </script>
</body>
</html>

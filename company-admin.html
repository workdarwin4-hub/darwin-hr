<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - لوحة تحكم الأدمن</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400" id="companyHeaderName">DARWIN HR - إدارة الشركة</h1>
                <p class="text-slate-400 text-sm mt-1">توليد أكواد الموظفين الذكية، الفروع، وسجلات البصمات</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportAttendanceToExcel()" class="bg-amber-600 hover:bg-amber-700 px-4 py-2 rounded-xl text-sm font-bold">📊 تقارير Excel</button>
                <a href="employee.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl text-sm font-bold">تطبيق الموظفين</a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold">خروج</a>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-blue-400">🏢 إعداد الفروع ومواقع العمل (GPS)</h2>
                <input type="text" id="branchName" placeholder="اسم الفرع" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="branchLat" placeholder="Lat" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                    <input type="text" id="branchLng" placeholder="Lng" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                </div>
                <button onclick="fetchCurrentLocation()" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-2 rounded-xl text-xs">📍 جلب موقعي</button>
                <button onclick="addBranch()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-2 rounded-xl text-sm">حفظ الفرع</button>
            </div>

            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-blue-400">👤 تسجيل موظف جديد</h2>
                <input type="text" id="empName" placeholder="اسم الموظف" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <input type="text" id="empPhone" placeholder="رقم الهاتف" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="empNationalId" placeholder="الرقم القومي" maxlength="14" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                    <input type="text" id="empManagerId" placeholder="كود المدير (HR ID)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                </div>
                <select id="empBranchSelect" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm"><option value="">اختر الفرع</option></select>
                <button onclick="addEmployee()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2 rounded-xl text-sm">حفظ الموظف</button>
            </div>
        </div>

        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
            <h2 class="text-xl font-bold text-amber-400">⚡ جدول الموظفين وأكواد دخولهم التلقائية</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="p-3">صورة</th>
                            <th class="p-3">كود الدخول الموحد (اختصار الشركة + الرقم)</th>
                            <th class="p-3">اسم الموظف والبيانات</th>
                            <th class="p-3">الراتب</th>
                            <th class="p-3">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="employeesControlTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, set, get, onValue, update, remove } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company') || 'main_company';
        let companyPrefix = "cmp";

        // سحب اسم الشركة الحقيقي وتوليد أول 3 حروف صحيحة منه
        get(ref(database, `companies/${currentCompany}`)).then(snap => {
            if(snap.exists()) {
                const compName = snap.val().name || "company";
                document.getElementById('companyHeaderName').innerText = "شركة: " + compName;
                // استخراج أول 3 حروف إنجليزية من اسم الشركة (ولو بالعربي بياخد أول حروف أو بيولد افتراضي آمن)
                let cleanName = compName.replace(/[^a-zA-Z]/g, '');
                if(cleanName.length >= 3) {
                    companyPrefix = cleanName.substring(0, 3).toLowerCase();
                } else {
                    companyPrefix = currentCompany.replace('COMP-', '').substring(0, 3).toLowerCase();
                }
            }
        });

        window.fetchCurrentLocation = function() {
            if(!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('branchLat').value = pos.coords.latitude;
                document.getElementById('branchLng').value = pos.coords.longitude;
            });
        }

        window.addBranch = function() {
            const name = document.getElementById('branchName').value.trim();
            const lat = document.getElementById('branchLat').value.trim();
            const lng = document.getElementById('branchLng').value.trim();
            if(!name || !lat || !lng) return;
            const branchId = 'BR-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            set(ref(database, `companiesData/${currentCompany}/branches/${branchId}`), { branchId, name, lat, lng }).then(() => alert('تم حفظ الفرع!'));
        }

        onValue(ref(database, `companiesData/${currentCompany}/branches`), (snapshot) => {
            const select = document.getElementById('empBranchSelect');
            select.innerHTML = '<option value="">اختر الفرع</option>';
            if(snapshot.exists()) {
                snapshot.forEach(child => {
                    const b = child.val();
                    select.innerHTML += `<option value="${b.branchId}">${b.name}</option>`;
                });
            }
        });

        window.addEmployee = function() {
            const name = document.getElementById('empName').value.trim();
            const phone = document.getElementById('empPhone').value.trim();
            const nationalId = document.getElementById('empNationalId').value.trim();
            const managerId = document.getElementById('empManagerId').value.trim();
            const branchId = document.getElementById('empBranchSelect').value;
            
            if(!name || !phone || !branchId) { alert('أدخل بيانات الموظف الأساسية'); return; }

            get(ref(database, `companiesData/${currentCompany}/employees`)).then((snapshot) => {
                let nextId = 1000;
                if(snapshot.exists()) {
                    const ids = Object.keys(snapshot.val()).map(Number).filter(n => !isNaN(n));
                    if(ids.length > 0) nextId = Math.max(...ids) + 1;
                }

                set(ref(database, `companiesData/${currentCompany}/employees/${nextId}`), {
                    name, phone, nationalId, managerId: managerId || '', branchId, empId: nextId.toString(),
                    role: 'employee', status: 'active', finalNetPay: 0, profileImg: 'https://via.placeholder.com/60'
                }).then(() => {
                    const generatedCode = (companyPrefix + nextId).toUpperCase();
                    alert('تم تسجيل الموظف بنجاح!\n🔑 كود دخوله الموحد للتطبيق: ' + generatedCode);
                });
            });
        }

        onValue(ref(database, `companiesData/${currentCompany}/employees`), (snapshot) => {
            const tbody = document.getElementById('employeesControlTable');
            tbody.innerHTML = '';
            if(snapshot.exists()) {
                const emps = snapshot.val();
                Object.values(emps).forEach(emp => {
                    const unifiedLoginCode = (companyPrefix + emp.empId).toUpperCase();
                    const isSupervisor = emp.role === 'supervisor';

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800/60">
                            <td class="p-3"><img src="${emp.profileImg || 'https://via.placeholder.com/60'}" class="w-10 h-10 rounded-full object-cover"></td>
                            <td class="p-3 font-mono font-bold text-amber-400 text-base">${unifiedLoginCode}</td>
                            <td class="p-3 font-bold">${emp.name}<br><span class="text-xs text-slate-400">هاتف: ${emp.phone}</span></td>
                            <td class="p-3 text-xs">
                                <input type="number" id="pay_${emp.empId}" value="${emp.finalNetPay || 0}" class="w-20 bg-slate-950 border border-slate-800 p-1 rounded text-xs">
                                <button onclick="updatePay('${emp.empId}')" class="bg-emerald-600 px-2 py-1 rounded text-[10px] mt-1 block">اعتماد</button>
                            </td>
                            <td class="p-3 space-y-1">
                                <button onclick="toggleRole('${emp.empId}', '${emp.role}')" class="px-2 py-1 rounded text-xs font-bold block w-full ${isSupervisor ? 'bg-amber-600' : 'bg-purple-600'}">${isSupervisor ? 'إلغاء الإشراف' : '⭐ ترقية مشرف'}</button>
                                <button onclick="deleteEmployee('${emp.empId}')" class="bg-red-600 px-2 py-1 rounded text-xs font-bold block w-full">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            }
        });

        window.toggleRole = function(empId, currentRole) {
            const newRole = (currentRole === 'supervisor') ? 'employee' : 'supervisor';
            update(ref(database, `companiesData/${currentCompany}/employees/${empId}`), { role: newRole }).then(() => alert('تم تعديل الصلاحية!'));
        }

        window.updatePay = function(empId) {
            const pay = Number(document.getElementById(`pay_${empId}`).value);
            update(ref(database, `companiesData/${currentCompany}/employees/${empId}`), { finalNetPay: pay }).then(() => alert('تم اعتماد الراتب!'));
        }

        window.deleteEmployee = function(empId) {
            if(confirm('حذف الموظف؟')) remove(ref(database, `companiesData/${currentCompany}/employees/${empId}`)).then(() => alert('تم الحذف!'));
        }

        window.exportAttendanceToExcel = function() {
            get(ref(database, `companiesData/${currentCompany}/attendance`)).then((snapshot) => {
                if(!snapshot.exists()) { alert('لا توجد سجلات!'); return; }
                let csv = "\uFEFFHR ID,اسم الموظف,الحالة,الوقت,الموقع\n";
                snapshot.forEach(c => {
                    const l = c.val();
                    csv += `"${l.empId}","${l.name}","${l.type || 'دخول'}","${l.time}","${l.location || ''}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Attendance_${currentCompany}.csv`;
                a.click();
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - لوحة تحكم الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-400" id="companyTitleName">لوحة إدارة الشركة</h1>
                <p class="text-slate-400 text-sm">إدارة الفروع، الموظفين، وحساب الرواتب باليومية</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportPayrollSheet()" class="bg-amber-600 hover:bg-amber-700 px-4 py-2 rounded-lg text-sm font-bold shadow-lg">📊 تصدير شيت الرواتب (Excel)</button>
                <a href="employee.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-sm font-bold">تطبيق الموظفين</a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 px-4 py-2 rounded-lg text-sm font-bold">خروج</a>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- إدارة الفروع -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-300">🏢 إضافة فروع ومقرات العمل</h2>
                <div class="space-y-3">
                    <input type="text" id="branchName" placeholder="اسم الفرع (مثال: فرع القاهرة)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="branchLat" placeholder="خط العرض (Lat)" class="bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                        <input type="text" id="branchLng" placeholder="خط الطول (Lng)" class="bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                    </div>
                    <button onclick="getCurrentLocationForBranch()" class="w-full bg-amber-600 hover:bg-amber-700 font-bold py-2 rounded-lg text-sm">📍 جلب موقعي الحالي</button>
                    <button onclick="addBranch()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-2 rounded-lg text-sm">حفظ الفرع</button>
                </div>
            </div>

            <!-- إضافة موظف وتحديد أجر اليومية -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-300">👤 إضافة موظف وتحديد أجر اليومية</h2>
                <div class="space-y-3">
                    <input type="text" id="empName" placeholder="اسم الموظف الثلاثي" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                    <input type="text" id="empPhone" placeholder="رقم الهاتف" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                    <input type="number" id="empDailyRate" placeholder="قيمة أجر اليومية (مثال: 300 جنية)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                    <select id="empBranchSelect" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm">
                        <option value="">اختر الفرع التابع له</option>
                    </select>
                    <button onclick="addEmployee()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2 rounded-lg text-sm">تسجيل الموظف</button>
                </div>
            </div>
        </div>

        <!-- قائمة الفروع -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl mb-8">
            <h2 class="text-xl font-bold mb-4">الفروع المسجلة</h2>
            <div id="branchesList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- جدول الموظفين وأجورهم -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl mb-8">
            <h2 class="text-xl font-bold mb-4">قائمة الموظفين وأجور اليوميات</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="p-3">HR ID</th>
                            <th class="p-3">الاسم</th>
                            <th class="p-3">الهاتف</th>
                            <th class="p-3">أجر اليومية</th>
                            <th class="p-3">الفرع</th>
                            <th class="p-3">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="employeesTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, set, get, onValue, update } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company');
        if(!currentCompany) window.location.href = 'index.html';

        document.getElementById('companyTitleName').innerText = "لوحة تحكم الشركة: " + currentCompany;

        let globalEmployees = {};
        let globalAttendance = [];

        window.getCurrentLocationForBranch = function() {
            if(!navigator.geolocation) { alert("المتصفح لا يدعم الـ GPS"); return; }
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('branchLat').value = pos.coords.latitude;
                document.getElementById('branchLng').value = pos.coords.longitude;
                alert("تم جلب إحداثيات الفرع بنجاح!");
            });
        }

        window.addBranch = function() {
            const name = document.getElementById('branchName').value.trim();
            const lat = document.getElementById('branchLat').value.trim();
            const lng = document.getElementById('branchLng').value.trim();
            if(!name || !lat || !lng) { alert('أدخل اسم الفرع والإحداثيات'); return; }

            const branchId = 'BR-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            set(ref(database, `companiesData/${currentCompany}/branches/${branchId}`), { branchId, name, lat, lng }).then(() => {
                alert('تم إضافة الفرع بنجاح');
                document.getElementById('branchName').value = '';
                document.getElementById('branchLat').value = '';
                document.getElementById('branchLng').value = '';
            });
        }

        onValue(ref(database, `companiesData/${currentCompany}/branches`), (snapshot) => {
            const select = document.getElementById('empBranchSelect');
            const container = document.getElementById('branchesList');
            select.innerHTML = '<option value="">اختر الفرع التابع له</option>';
            container.innerHTML = '';
            if(snapshot.exists()) {
                snapshot.forEach(child => {
                    const b = child.val();
                    select.innerHTML += `<option value="${b.branchId}">${b.name}</option>`;
                    container.innerHTML += `<div class="p-4 bg-slate-900 rounded-xl border border-slate-700"><h3 class="font-bold text-blue-400">${b.name}</h3></div>`;
                });
            }
        });

        window.addEmployee = function() {
            const name = document.getElementById('empName').value.trim();
            const phone = document.getElementById('empPhone').value.trim();
            const dailyRate = Number(document.getElementById('empDailyRate').value) || 0;
            const branchId = document.getElementById('empBranchSelect').value;
            
            if(!name || !phone || !branchId) { alert('أدخل كافة البيانات الأساسية'); return; }

            get(ref(database, `companiesData/${currentCompany}/employees`)).then((snapshot) => {
                let nextId = 1000;
                if(snapshot.exists()) {
                    const ids = Object.keys(snapshot.val()).map(Number).filter(n => !isNaN(n));
                    if(ids.length > 0) nextId = Math.max(...ids) + 1;
                }

                set(ref(database, `companiesData/${currentCompany}/employees/${nextId}`), {
                    name, phone, dailyRate, branchId, empId: nextId.toString(), status: 'active', profileImg: ''
                }).then(() => {
                    alert('تم تسجيل الموظف برقم HR ID: ' + nextId);
                    document.getElementById('empName').value = '';
                    document.getElementById('empPhone').value = '';
                    document.getElementById('empDailyRate').value = '';
                });
            });
        }

        onValue(ref(database, `companiesData/${currentCompany}/employees`), (snapshot) => {
            const tbody = document.getElementById('employeesTable');
            tbody.innerHTML = '';
            if(snapshot.exists()) {
                globalEmployees = snapshot.val();
                Object.values(globalEmployees).forEach(emp => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-700/50">
                            <td class="p-3 font-mono text-blue-400 font-bold">${emp.empId}</td>
                            <td class="p-3 font-bold">${emp.name}</td>
                            <td class="p-3">${emp.phone}</td>
                            <td class="p-3 text-emerald-400 font-bold">${emp.dailyRate || 0} جنية/يوم</td>
                            <td class="p-3 font-mono">${emp.branchId}</td>
                            <td class="p-3"><button onclick="toggleBlock('${emp.empId}', '${emp.status}')" class="px-2 py-1 rounded text-xs ${emp.status==='active'?'bg-red-600':'bg-emerald-600'}">${emp.status==='active'?'حظر':'تفعيل'}</button></td>
                        </tr>
                    `;
                });
            }
        });

        onValue(ref(database, `companiesData/${currentCompany}/attendance`), (snapshot) => {
            globalAttendance = [];
            if(snapshot.exists()) {
                snapshot.forEach(child => { globalAttendance.push(child.val()); });
            }
        });

        // تصدير شيت الرواتب (أيام الحضور × أجر اليومية)
        window.exportPayrollSheet = function() {
            let csvContent = "\uFEFFHR ID,اسم الموظف,أجر اليومية,عدد أيام الحضور,إجمالي المستحق\n";
            
            Object.values(globalEmployees).forEach(emp => {
                let attendedDays = new Set();
                globalAttendance.forEach(log => {
                    if(log.empId === emp.empId && log.type === 'دخول') {
                        attendedDays.add(log.time.split(',')[0]);
                    }
                });

                let daysCount = attendedDays.size;
                let totalNet = daysCount * (emp.dailyRate || 0);

                csvContent += `${emp.empId},"${emp.name}",${emp.dailyRate || 0},${daysCount},${totalNet}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Darwin_Daily_Payroll_${currentCompany}_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.toggleBlock = function(empId, status) {
            update(ref(database, `companiesData/${currentCompany}/employees/${empId}`), { status: status === 'active' ? 'blocked' : 'active' });
        }
    </script>
</body>
</html>

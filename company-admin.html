<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - لوحة تحكم الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400" id="companyHeaderName">جاري تحميل اسم الشركة...</h1>
                <p class="text-slate-400 text-sm mt-1">لوحة الإدارة وتحديد المديرين المباشرين للموظفين</p>
            </div>
            <div class="flex gap-3">
                <a href="employee.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl text-sm font-bold">تطبيق الموظفين</a>
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-bold">خروج</a>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- الفروع وموقع العمل -->
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-300">🏢 الفروع وتحديد موقع العمل (GPS)</h2>
                <div class="space-y-3">
                    <input type="text" id="branchName" placeholder="اسم الفرع" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="branchLat" placeholder="Lat" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                        <input type="text" id="branchLng" placeholder="Lng" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    </div>
                    <button onclick="fetchCurrentLocation()" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-2 rounded-xl text-xs">📍 جلب موقعي الحالي</button>
                    <button onclick="addBranch()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-2 rounded-xl text-sm">حفظ الفرع</button>
                </div>
            </div>

            <!-- تسجيل موظف وتحديد المدير المباشر بالـ HR ID -->
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold mb-4 text-blue-300">👤 تسجيل موظف وتحديد المدير المباشر</h2>
                <div class="space-y-3">
                    <input type="text" id="empName" placeholder="اسم الموظف الثلاثي" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <input type="text" id="empPhone" placeholder="رقم الهاتف" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <input type="text" id="empNationalId" placeholder="الرقم القومي (14 رقم)" maxlength="14" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <input type="text" id="empManagerId" placeholder="كود المدير المباشر (HR ID)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <input type="number" id="empDailyRate" placeholder="أجر اليومية" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    <select id="empBranchSelect" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm"><option value="">اختر الفرع / موقع العمل</option></select>
                    <button onclick="addEmployee()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2 rounded-xl text-sm">تسجيل الموظف</button>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold mb-4">قائمة الموظفين والمديرين المباشرين</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="p-3">HR ID</th>
                            <th class="p-3">الاسم</th>
                            <th class="p-3">الرقم القومي</th>
                            <th class="p-3">مدير مباشر (HR ID)</th>
                            <th class="p-3">الصلاحية</th>
                        </tr>
                    </thead>
                    <tbody id="employeesTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, set, get, onValue, update } from "./firebase-config.js";
        const currentCompany = localStorage.getItem('darwin_current_company');
        if(!currentCompany) window.location.href = 'index.html';

        let globalEmployees = {};

        get(ref(database, `companies/${currentCompany}`)).then(snap => {
            if(snap.exists()) {
                document.getElementById('companyHeaderName').innerText = "شركة: " + snap.val().name;
            }
        });

        window.fetchCurrentLocation = function() {
            if(!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع'); return; }
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('branchLat').value = pos.coords.latitude;
                document.getElementById('branchLng').value = pos.coords.longitude;
                alert('تم جلب الإحداثيات بنجاح!');
            }, () => { alert('فشل تحديد الموقع.'); });
        }

        window.addBranch = function() {
            const name = document.getElementById('branchName').value.trim();
            const lat = document.getElementById('branchLat').value.trim();
            const lng = document.getElementById('branchLng').value.trim();
            if(!name || !lat || !lng) { alert('أدخل بيانات الفرع'); return; }
            const branchId = 'BR-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            set(ref(database, `companiesData/${currentCompany}/branches/${branchId}`), { branchId, name, lat, lng }).then(() => alert('تم حفظ الفرع'));
        }

        onValue(ref(database, `companiesData/${currentCompany}/branches`), (snapshot) => {
            const select = document.getElementById('empBranchSelect');
            select.innerHTML = '<option value="">اختر الفرع / موقع العمل</option>';
            if(snapshot.exists()) {
                snapshot.forEach(child => {
                    const b = child.val();
                    select.innerHTML += `<option value="${b.branchId}">${b.name}</option>`;
                });
            }
        });

        window.addEmployee = function() {
            const name = document.getElementById('empName').value.trim();
            const phone = document.getElementById('empPhone').value.trim();
            const nationalId = document.getElementById('empNationalId').value.trim();
            const managerId = document.getElementById('empManagerId').value.trim();
            const dailyRate = Number(document.getElementById('empDailyRate').value) || 0;
            const branchId = document.getElementById('empBranchSelect').value;
            
            if(!name || !phone || !nationalId || !branchId) { alert('أدخل كافة البيانات الأساسية'); return; }

            get(ref(database, `companiesData/${currentCompany}/employees`)).then((snapshot) => {
                let nextId = 1000;
                if(snapshot.exists()) {
                    const ids = Object.keys(snapshot.val()).map(Number).filter(n => !isNaN(n));
                    if(ids.length > 0) nextId = Math.max(...ids) + 1;
                }

                set(ref(database, `companiesData/${currentCompany}/employees/${nextId}`), {
                    name, phone, nationalId, managerId, dailyRate, branchId, empId: nextId.toString(), role: 'employee', status: 'active', finalNetPay: 0
                }).then(() => { alert('تم تسجيل الموظف برقم HR ID: ' + nextId); });
            });
        }

        onValue(ref(database, `companiesData/${currentCompany}/employees`), (snapshot) => {
            const tbody = document.getElementById('employeesTable');
            tbody.innerHTML = '';
            if(snapshot.exists()) {
                globalEmployees = snapshot.val();
                Object.values(globalEmployees).forEach(emp => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-700/50">
                            <td class="p-3 font-mono text-blue-400 font-bold">${emp.empId}</td>
                            <td class="p-3 font-bold">${emp.name}</td>
                            <td class="p-3 font-mono text-amber-300">${emp.nationalId || 'غير مسجل'}</td>
                            <td class="p-3 font-mono text-purple-300">${emp.managerId ? 'HR ID: ' + emp.managerId : 'غير محدد'}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs ${emp.role==='supervisor'?'bg-purple-900 text-purple-300':'bg-slate-700 text-slate-300'}">${emp.role==='supervisor'?'مشرف':'موظف'}</span></td>
                        </tr>
                    `;
                });
            }
        });
    </script>
</body>
</html>

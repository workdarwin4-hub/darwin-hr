<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - النظام التجاري المتكامل</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
        <div>
            <h1 class="text-3xl font-extrabold text-blue-500 mb-1">DARWIN HR</h1>
            <p class="text-xs text-slate-400">النظام الذكي لإدارة الموارد البشرية وبصمات الـ GPS</p>
        </div>

        <div class="space-y-4 text-right">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">كود الشركة:</label>
                <input type="text" id="companyCodeInput" placeholder="مثال: company_abc" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="loginCompany()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl text-sm shadow-lg transition">دخول لوحة تحكم الشركة</button>
        </div>

        <div class="border-t border-slate-800 pt-4">
            <a href="employee.html" class="block w-full bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 font-bold py-2.5 rounded-xl text-xs hover:bg-emerald-600/30 transition">الانتقال إلى تطبيق الموظفين ➔</a>
        </div>

        <div class="text-[10px] text-slate-600 pt-2">
            Super Admin Password: <span class="font-mono">darwin_master_2026</span>
        </div>
    </div>

    <script type="module">
        import { database, ref, get } from "./firebase-config.js";

        window.loginCompany = function() {
            const code = document.getElementById('companyCodeInput').value.trim().toLowerCase();
            if(!code) { alert('أدخل كود الشركة'); return; }

            get(ref(database, `companies/${code}`)).then((snapshot) => {
                if(snapshot.exists()) {
                    localStorage.setItem('darwin_current_company', code);
                    window.location.href = 'company-admin.html';
                } else {
                    if(code === 'admin') {
                        localStorage.setItem('darwin_current_company', 'main_company');
                        window.location.href = 'company-admin.html';
                    } else {
                        alert('هذه الشركة غير مسجلة!');
                    }
                }
            });
        }
    </script>
</body>
</html>

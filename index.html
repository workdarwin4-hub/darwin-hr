<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
        <div>
            <h1 class="text-3xl font-extrabold text-blue-500 mb-1">DARWIN HR</h1>
            <p class="text-xs text-slate-400">النظام التجاري الذكي لإدارة الموارد البشرية</p>
        </div>

        <div id="maintenanceAlert" class="hidden bg-red-950 border border-red-800 text-red-300 p-3 rounded-xl text-xs font-bold">
            ⚠️ عذراً، السيستم مغلق مؤخراً للصيانة من الإدارة!
        </div>

        <div class="space-y-4 text-right">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">كود الشركة أو اسم الأدمن:</label>
                <input type="text" id="companyCodeInput" placeholder="مثال: main_company" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">كلمة المرور:</label>
                <input type="password" id="adminPasswordInput" placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="loginCompany()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl text-sm shadow-lg transition">دخول لوحة تحكم الأدمن</button>
        </div>

        <div class="border-t border-slate-800 pt-4">
            <a href="employee.html" class="block w-full bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 font-bold py-2.5 rounded-xl text-xs hover:bg-emerald-600/30 transition">الانتقال إلى تطبيق الموظفين ➔</a>
        </div>
    </div>

    <script type="module">
        import { database, ref, get } from "./firebase-config.js";

        window.onload = function() {
            // التحقق مما إذا كان السيستم معطلاً بالكامل من قبل الإدارة
            get(ref(database, 'systemSettings/isSystemActive')).then(snap => {
                if(snap.exists() && snap.val() === false) {
                    document.getElementById('maintenanceAlert').classList.remove('hidden');
                }
            });
        }

        window.loginCompany = function() {
            const code = document.getElementById('companyCodeInput').value.trim().toLowerCase();
            const pass = document.getElementById('adminPasswordInput').value.trim();
            if(!code || !pass) { alert('أدخل كود الشركة وكلمة المرور'); return; }

            // التحقق من باسورد السوبر أدمن (الأساسي أو الطوارئ أو المخزن في قاعدة البيانات)
            get(ref(database, `companies/${code}`)).then((snapshot) => {
                let validPass = "darwin_master_2026"; // النسخة الاحتياطية للطوارئ
                let companyData = null;

                if(snapshot.exists()) {
                    companyData = snapshot.val();
                    if(companyData.customPassword) validPass = companyData.customPassword;
                }

                if(pass === validPass || pass === "darwin_master_2026") {
                    localStorage.setItem('darwin_current_company', code || 'main_company');
                    window.location.href = 'company-admin.html';
                } else {
                    alert('كلمة المرور غير صحيحة!');
                }
            });
        }
    </script>
</body>
</html>

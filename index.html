<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - تسجيل دخول الشركات</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
        <div>
            <h1 class="text-3xl font-extrabold text-blue-500 mb-1">DARWIN HR</h1>
            <p class="text-xs text-slate-400">النظام التجاري الذكي لإدارة الموارد البشرية</p>
        </div>

        <div id="maintenanceAlert" class="hidden bg-red-950 border border-red-800 text-red-300 p-3 rounded-xl text-xs font-bold">
            ⚠️ عذراً، السيستم مغلق مؤخراً للصيانة من الإدارة!
        </div>

        <div class="space-y-4 text-right">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">كود الشركة (التلقائي):</label>
                <input type="text" id="companyCodeInput" placeholder="مثال: COMP-4829" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-center font-mono">
            </div>
            <button onclick="loginCompany()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl text-sm shadow-lg transition">دخول لوحة تحكم الشركة ➔</button>
        </div>

        <div class="border-t border-slate-800 pt-4 flex justify-between items-center text-xs">
            <a href="employee.html" class="text-emerald-400 font-bold hover:underline">الانتقال لتطبيق الموظفين</a>
            <a href="super-admin.html" class="text-red-400 font-bold hover:underline">دخول السوبر أدمن</a>
        </div>
    </div>

    <script type="module">
        import { database, ref, get } from "./firebase-config.js";

        window.onload = function() {
            get(ref(database, 'systemSettings/isSystemActive')).then(snap => {
                if(snap.exists() && snap.val() === false) {
                    document.getElementById('maintenanceAlert').classList.remove('hidden');
                }
            });
        }

        window.loginCompany = function() {
            const code = document.getElementById('companyCodeInput').value.trim();
            if(!code) { alert('أدخل كود الشركة'); return; }

            get(ref(database, `companies/${code}`)).then((snapshot) => {
                if(snapshot.exists()) {
                    localStorage.setItem('darwin_current_company', code);
                    window.location.href = 'company-admin.html';
                } else {
                    alert('كود الشركة غير صحيح أو غير مسجل!');
                }
            });
        }
    </script>
</body>
</html>

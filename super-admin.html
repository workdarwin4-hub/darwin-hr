<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARWIN HR - Super Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-red-500">لوحة التحكم العليا (Super Admin)</h1>
                <p class="text-slate-400 text-sm">التحكم في اشتراكات الشركات وتواريخ انتهائها</p>
            </div>
            <a href="index.html" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm font-bold">خروج</a>
        </header>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-blue-400">إضافة شركة جديدة وتحديد مدة الاشتراك</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="compName" placeholder="اسم الشركة" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none">
                <input type="text" id="compPhone" placeholder="رقم الهاتف" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none">
                <input type="date" id="compExpireDate" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none text-slate-300">
                <button onclick="createCompany()" class="bg-blue-600 hover:bg-blue-700 font-bold p-3 rounded-xl text-sm">إنشاء الشركة</button>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 shadow-xl">
            <input type="text" id="searchCompInput" oninput="filterCompanies()" placeholder="🔍 ابحث عن أي شركة بالاسم أو الكود..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none">
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
            <h2 class="text-xl font-bold mb-4">قائمة الشركات المشتركة</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                            <th class="p-3">اسم الشركة</th>
                            <th class="p-3">الكود</th>
                            <th class="p-3">انتهاء الاشتراك</th>
                            <th class="p-3">الحالة</th>
                            <th class="p-3">إجراءات السوبر</th>
                        </tr>
                    </thead>
                    <tbody id="companiesList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { database, ref, set, onValue, update } from "./firebase-config.js";
        let allCompanies = {};

        window.createCompany = function() {
            const name = document.getElementById('compName').value.trim();
            const phone = document.getElementById('compPhone').value.trim();
            const expireDate = document.getElementById('compExpireDate').value;
            if(!name || !phone || !expireDate) { alert('أدخل كافة البيانات وتاريخ الانتهاء'); return; }

            const code = 'DRW-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            set(ref(database, 'companies/' + code), {
                name, phone, code, status: 'active', expireDate, createdAt: new Date().toISOString()
            }).then(() => {
                alert('تم إنشاء الشركة بنجاح والكود هو: ' + code);
                document.getElementById('compName').value = '';
                document.getElementById('compPhone').value = '';
            });
        }

        onValue(ref(database, 'companies'), (snapshot) => {
            if(snapshot.exists()) {
                allCompanies = snapshot.val();
                renderCompanies(allCompanies);
            }
        });

        function renderCompanies(data) {
            const tbody = document.getElementById('companiesList');
            tbody.innerHTML = '';
            Object.values(data).forEach(c => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-800/50">
                        <td class="p-3 font-bold">${c.name}</td>
                        <td class="p-3 text-blue-400 font-mono">${c.code}</td>
                        <td class="p-3 text-amber-400">${c.expireDate || 'غير محدد'}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs ${c.status==='active'?'bg-green-900 text-green-300':'bg-red-900 text-red-300'}">${c.status==='active'?'نشط':'موقوف'}</span></td>
                        <td class="p-3 flex gap-2">
                            <button onclick="toggleStatus('${c.code}', '${c.status}')" class="px-3 py-1 rounded text-xs font-bold ${c.status==='active'?'bg-red-600':'bg-green-600'}">
                                ${c.status==='active'?'إيقاف':'تفعيل'}
                            </button>
                            <button onclick="loginAsCompany('${c.code}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs font-bold">دخول</button>
                        </td>
                    </tr>
                `;
            });
        }

        window.filterCompanies = function() {
            const query = document.getElementById('searchCompInput').value.toLowerCase();
            const filtered = {};
            Object.values(allCompanies).forEach(c => {
                if(c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)) {
                    filtered[c.code] = c;
                }
            });
            renderCompanies(filtered);
        }

        window.toggleStatus = function(code, current) {
            update(ref(database, 'companies/' + code), { status: current === 'active' ? 'suspended' : 'active' });
        }

        window.loginAsCompany = function(code) {
            localStorage.setItem('darwin_current_company', code);
            window.location.href = 'company-admin.html';
        }
    </script>
</body>
</html>
